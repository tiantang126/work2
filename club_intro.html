<h1>小提琴社合奏排练活动介绍</h1>
<p>本次合奏排练是社团常规活动之一，活动地点为艺术楼A203与艺术楼排练厅。活动分为基础训练和合奏分声部练习两个部分。首先由社团负责人带领大家进行空弦、音阶热身，纠正运弓姿势；之后分发合奏乐谱，按照一提、二提声部分开练习，最后合排完整乐曲。零基础同学可以在旁边观摩学习，有演奏基础的社员可以加入声部一起合奏。活动不收取任何费用，欢迎感兴趣的同学到场观摩。</p>
